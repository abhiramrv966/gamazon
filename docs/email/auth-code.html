<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Verify your email — Gamazon</title>
  </head>
  <body style="margin: 0; background: #f6f3ec; color: #172019; font-family: Arial, sans-serif">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
      <tr>
        <td align="center" style="padding: 40px 20px">
          <table
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            style="max-width: 480px"
          >
            <tr>
              <td
                style="
                  padding-bottom: 40px;
                  font-size: 26px;
                  font-weight: 700;
                  letter-spacing: -1px;
                "
              >
                gamazon<span style="color: #937043">.</span>
              </td>
            </tr>
            <tr>
              <td>
                <h1
                  style="
                    margin: 0 0 14px;
                    font-size: 28px;
                    font-weight: 600;
                    letter-spacing: -0.7px;
                  "
                >
                  Verify your email
                </h1>
                <p style="margin: 0 0 28px; font-size: 16px; line-height: 1.6">
                  Enter this code to finish creating your account.
                </p>
                <p
                  style="
                    margin: 0 0 32px;
                    padding: 22px 16px;
                    background: #e9e1d3;
                    border-radius: 12px;
                    text-align: center;
                    font-family: monospace;
                    font-size: 34px;
                    font-weight: 700;
                    letter-spacing: 5px;
                  "
                >
                  {{ .Token }}
                </p>
                <p style="margin: 0; color: #666b63; font-size: 14px; line-height: 1.6">
                  If you didn’t request this code, you can ignore this email.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
