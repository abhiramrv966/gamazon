name: Validate Gamazon
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
        env:
          GAMAZON_DEMO: 'true'
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          GAMAZON_DEMO: 'true'
          GAMAZON_E2E_PRODUCTION: 'true'
      - run: npm run test:auth
      - run: npm run test:scale
        env:
          GAMAZON_DEMO: 'true'
          GAMAZON_E2E_PRODUCTION: 'true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-artifacts
          path: |
            artifacts/
            test-results/
          retention-days: 7
